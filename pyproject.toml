[project]
name = "crow-research"
version = "0.1.0"
description = "A multi-agent ACP v2 orchestrator: one agent upstream, a cast of specialized agents downstream"
readme = "README.md"
authors = [
    { name = "Thomas Wood", email = "odell.wood@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "agent-client-protocol>=1.0.0rc3",
    "crow-cli>=0.1.48",
    # `serve_http` imports it directly; crow-cli already brings it, but a direct
    # import is a direct dependency.
    "hypercorn>=0.18",
]

[project.scripts]
crow-research = "crow_research:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
